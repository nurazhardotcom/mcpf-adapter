stages:
  - mirror

mirror-github:
  stage: mirror
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git remote set-url origin "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/nurazhardotcom/${CI_PROJECT_NAME}.git"
    - git push origin main --force
  only:
    - main
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
